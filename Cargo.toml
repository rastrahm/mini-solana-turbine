[package]
name = "mini-solana-turbine"
version = "0.1.0"
edition = "2021"
description = "Motor educativo de ingestión de shreds y fanout estilo Turbine (Solana)"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["uring", "simd"]
# UDP `io_uring` (`tokio-uring`). Sin el flag, `UdpIngress` no se compila.
uring = ["dep:tokio-uring"]
# Reed-Solomon SIMD (`reed-solomon-simd`). Sin el flag, no hay `FecEngine` ni `Pipeline`.
simd = ["dep:reed-solomon-simd"]

[dependencies]
thiserror = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
crossbeam-channel = "0.5"
reed-solomon-simd = { version = "3", optional = true }
tokio-uring = { version = "0.5", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "shred_throughput"
harness = false
required-features = ["simd"]

[[test]]
name = "pipeline_ingest"
required-features = ["simd"]

[[test]]
name = "forward_udp"
required-features = ["uring", "simd"]

[lib]
name = "mini_solana_turbine"
path = "src/lib.rs"

[[bin]]
name = "mini-solana-turbine"
path = "src/main.rs"
required-features = ["simd"]
